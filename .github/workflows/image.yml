# Builds the Vast.ai template image on a GitHub runner and pushes it to GHCR.
#
# Runners are x86, so there is no QEMU emulation, and they push to a registry
# over a datacenter connection -- which is the whole point. The image is
# 10-15 GB, and uploading that from a laptop is an afternoon.
#
# Run it from the Actions tab (Run workflow), or push a tag like image-v1.
name: template image

on:
  workflow_dispatch:
    inputs:
      model:
        description: Model to bake into the image
        type: choice
        options: [mrt2_small, mrt2_base]
        default: mrt2_small
      tag:
        description: Image tag
        type: string
        default: latest
  push:
    tags: ['image-v*']

jobs:
  build:
    runs-on: ubuntu-latest
    # Well above the expected build, but the model download is on the far side
    # of the slow pip step -- a stall there should fail, not burn the 6h default.
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # A stock runner has ~14 GB free, and this image does not fit in that.
      # These four directories are preinstalled toolchains nothing here uses,
      # and removing them frees roughly 30 GB.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache
          sudo docker image prune -af
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No layer caching on purpose: the cache limit is 10 GB, the image is
      # larger than that, and a cache that always misses costs upload time on
      # every run to save nothing.
      - uses: docker/build-push-action@v6
        with:
          context: ./docker
          platforms: linux/amd64
          push: true
          build-args: |
            MUSIC_MODEL=${{ inputs.model || 'mrt2_small' }}
          tags: ghcr.io/${{ github.repository }}:${{ inputs.tag || 'latest' }}

      - name: Where it landed
        run: |
          echo "Pushed ghcr.io/${{ github.repository }}:${{ inputs.tag || 'latest' }}"
          echo "Make the package public under the repo's Packages tab, or give"
          echo "Vast registry credentials, before an instance can pull it."
